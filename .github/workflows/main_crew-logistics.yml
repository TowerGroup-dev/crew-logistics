name: Build and deploy Node.js app to Azure Web App - crew-logistics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack the app
        run: |
          mkdir -p release
          # Standalone server + static assets (reliable on Azure App Service)
          cp -a .next/standalone/. release/
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          if [ -d public ]; then cp -a public release/public; fi
          # Azure runs `npm start` — point it at the standalone server.
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('release/package.json','utf8')); p.scripts={...(p.scripts||{}), start:'node server.js'}; fs.writeFileSync('release/package.json', JSON.stringify(p,null,2));"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'crew-logistics'
          slot-name: 'Production'
          package: release
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_662351FE02174430ACF464A374872DB5 }}
          clean: true
          restart: true
