name: Build and deploy Node.js app to Azure Web App - crew-logistics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Pack the app
        run: |
          mkdir -p release
          cp -a .next package.json package-lock.json next.config.ts tsconfig.json release/
          if [ -d public ]; then cp -a public release/; fi
          cd release
          npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'crew-logistics'
          slot-name: 'Production'
          package: release
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_662351FE02174430ACF464A374872DB5 }}
